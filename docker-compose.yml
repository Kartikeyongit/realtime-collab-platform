version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: collab-platform-db
    environment:
      POSTGRES_DB: collab-platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: collab-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collab-platform-app
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - NEXTAUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:3001
      - NEXT_PUBLIC_YJS_URL=ws://localhost:1234
    depends_on:
      postgres:
        condition: service_healthy

  yjs-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collab-platform-yjs
    ports:
      - "1234:1234"
    env_file: .env
    environment:
      - YJS_PORT=1234
    volumes:
      - yjs_data:/app/yjs-data
    command: node server/yjs-server.js
    depends_on:
      postgres:
        condition: service_healthy

  socket-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collab-platform-socket
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      - SOCKET_PORT=3001
      - NEXTAUTH_URL=http://localhost:3000
    command: npx ts-node --project tsconfig.server.json src/server/index.ts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  yjs_data:
